<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendários acadêmicos · UniAnchieta</title>
    <meta name="description" content="Gestão dos calendários acadêmicos do Centro Universitário Padre Anchieta: importação, conferência, publicação e avisos." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a10" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          // a mesma chave e o mesmo formato de lib/theme.ts — se mudar um, mude o outro.
          // O armazenamento serializa em JSON: a entrada crua é '"dark"', com aspas.
          var stored = localStorage.getItem('calendarios.v1.theme');
          var pref = 'system';
          try {
            pref = stored ? JSON.parse(stored) : 'system';
          } catch (e) {
            pref = stored; // valor antigo, sem aspas
          }
          if (pref !== 'light' && pref !== 'dark') pref = 'system';
          var theme = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* armazenamento indisponível — fica no claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
